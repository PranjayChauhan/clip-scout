[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clip-scout"
version = "0.1.0"
description = "Zero-token-burn clipping campaign discovery engine, CLI, universal AI Agent Skill, and FastMCP server."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
  { name = "clip-scout contributors" }
]
keywords = ["clipping", "content-rewards", "mcp", "ai-agent", "skill", "whop", "shorts", "tiktok", "reels"]
dependencies = [
  "pydantic>=2.7.0",
  "httpx>=0.27.0",
  "typer>=0.12.0",
  "rich>=13.7.0",
  "fastmcp>=2.0.0",
]

[project.optional-dependencies]
browser = [
  "playwright>=1.45.0",
]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "respx>=0.21.0",
]

[project.scripts]
clipscout = "src.cli:app"
clipscout-mcp = "src.mcp_app:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
